<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Founder Simulator</title>

<style>
body{
margin:0;
font-family:Arial;
background:#020617;
color:white;
overflow:hidden;
}

#center{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:360px;
background:#0f172a;
padding:20px;
border-radius:12px;
border:1px solid #00d4ff;
}

input,select{
width:100%;
padding:10px;
margin-top:8px;
border:none;
border-radius:6px;
background:#111827;
color:white;
}

button{
width:100%;
margin-top:12px;
padding:10px;
background:#00d4ff;
border:none;
font-weight:bold;
cursor:pointer;
border-radius:6px;
}

button:hover{
transform:scale(1.03);
}

#game{
display:none;
padding:20px;
}

.stat{
color:#00d4ff;
margin:6px 0;
}

#log{
position:fixed;
right:10px;
top:10px;
width:300px;
height:90%;
background:#000;
padding:10px;
overflow:auto;
font-size:12px;
}
</style>
</head>

<body>

<div id="center">
<h2>🧠 Create Your Token</h2>

<input id="name" placeholder="Token name (e.g. MGOT)">
<select id="chain">
  <option>Solana</option>
  <option>Ethereum</option>
  <option>Base</option>
  <option>BNB Chain</option>
</select>

<input id="budget" type="number" placeholder="Starting budget (USD)">

<button onclick="start()">🚀 Launch Token</button>
</div>

<div id="game">
  <h2>📊 Token Dashboard</h2>

  <div class="stat">💰 Cash: <span id="cash">0</span></div>
  <div class="stat">👥 Users: <span id="users">0</span></div>
  <div class="stat">📈 Price: <span id="price">0</span></div>
  <div class="stat">💎 MarketCap: <span id="mc">0</span></div>

  <hr>

  <button onclick="marketing()">📢 Marketing (-100)</button>
  <button onclick="dev()">👨‍💻 Improve Token (-150)</button>
  <button onclick="influencer()">🚀 Influencer (-300)</button>
  <button onclick="risk()">⚠ Event</button>
</div>

<div id="log"></div>

<script>

let state = {
name:"",
chain:"",
cash:0,
users:1,
price:0.01,
quality:0
};

function log(t){
let d=document.createElement("div");
d.innerText=t;
document.getElementById("log").prepend(d);
}

function ui(){
document.getElementById("cash").innerText = Math.floor(state.cash);
document.getElementById("users").innerText = Math.floor(state.users);
document.getElementById("price").innerText = state.price.toFixed(5);
document.getElementById("mc").innerText = Math.floor(state.price * state.users);
}

// ================= START =================
function start(){

let name = document.getElementById("name").value;
let chain = document.getElementById("chain").value;
let budget = parseFloat(document.getElementById("budget").value);

if(!name || !budget){
alert("Fill name + budget");
return;
}

state.name = name;
state.chain = chain;
state.cash = budget;

document.getElementById("center").style.display="none";
document.getElementById("game").style.display="block";

log("🚀 Token launched: " + name + " on " + chain);
ui();

// passive economy
setInterval(tick,1000);
}

// ================= ECONOMY =================
function tick(){

let growth = state.users * 0.002;
state.price += growth;

state.cash += state.users * 0.1;

if(state.price < 0.0001) state.price = 0.0001;

ui();
}

// ================= ACTIONS =================

function marketing(){
if(state.cash < 100) return log("❌ Not enough cash");

state.cash -= 100;

let gain = Math.random()*5 + 1;
state.users += gain;

log("📢 Marketing +" + gain.toFixed(1) + " users");
ui();
}

function dev(){
if(state.cash < 150) return log("❌ Not enough cash");

state.cash -= 150;
state.price += 0.002;

log("🧠 Token improved (utility +)");
ui();
}

function influencer(){
if(state.cash < 300) return log("❌ Not enough cash");

state.cash -= 300;

let pump = Math.random()*0.05;
state.price += pump;
state.users += Math.random()*8;

log("🚀 Influencer pump event");
ui();
}

function risk(){

let r = Math.random();

if(r < 0.5){
state.price *= 0.6;
state.users *= 0.7;
log("💀 BAD EVENT: trust lost");
}else{
state.price *= 1.3;
state.users *= 1.2;
log("🛡 GOOD EVENT: hype increased");
}

ui();
}

</script>

</body>
</html>
