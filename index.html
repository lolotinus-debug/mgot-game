<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crypto Ecosystem Simulator</title>

<style>
body{
margin:0;
font-family:Arial;
background:#020617;
color:white;
overflow:hidden;
}

#start{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:360px;
background:#0f172a;
padding:20px;
border-radius:12px;
border:1px solid #00d4ff;
}

input,select{
width:100%;
padding:10px;
margin-top:8px;
background:#111827;
border:none;
color:white;
border-radius:6px;
}

button{
width:100%;
margin-top:8px;
padding:10px;
border:none;
border-radius:6px;
background:#00d4ff;
font-weight:bold;
cursor:pointer;
}

button:hover{
transform:scale(1.03);
}

#game{
display:none;
padding:10px;
}

.panel{
display:flex;
gap:10px;
}

.box{
flex:1;
background:#0f172a;
padding:10px;
border-radius:10px;
border:1px solid #1e293b;
}

.stat{
color:#00d4ff;
margin:3px 0;
font-size:13px;
}

#log{
position:fixed;
right:10px;
top:10px;
width:320px;
height:90%;
background:#000;
padding:10px;
overflow:auto;
font-size:12px;
}
</style>
</head>

<body>

<div id="start">
<h2>🧠 Create Token</h2>

<input id="name" placeholder="Token name">
<select id="chain">
<option>Solana</option>
<option>Ethereum</option>
<option>Base</option>
<option>BNB</option>
</select>

<input id="budget" type="number" placeholder="Budget USD">

<button onclick="start()">🚀 Launch Project</button>
</div>

<div id="game">

<div class="panel">

<div class="box">
<h3>📊 Market</h3>
<div class="stat">💰 Cash: <span id="cash"></span></div>
<div class="stat">👥 Users: <span id="users"></span></div>
<div class="stat">🪙 Price: <span id="price"></span></div>
<div class="stat">💎 MC: <span id="mc"></span></div>
<div class="stat">🏦 LP: <span id="lp"></span></div>
</div>

<div class="box">
<h3>🧠 Tokenomics</h3>
<div class="stat">📦 Supply: <span id="supply"></span></div>
<div class="stat">🔥 Burned: <span id="burned"></span></div>
<div class="stat">⚖ Trust: <span id="trust"></span></div>
<div class="stat">⚠ Risk: <span id="risk"></span></div>
<div class="stat">🔍 KYC: <span id="kyc"></span></div>
<div class="stat">📍 Roadmap: <span id="roadmap"></span></div>
</div>

<div class="box">
<h3>⚙ Actions</h3>
<button onclick="marketing()">📢 Marketing (-120)</button>
<button onclick="dev()">👨‍💻 Dev (-150)</button>
<button onclick="influencer()">🚀 Influencer (-300)</button>
<button onclick="burn()">🔥 Burn</button>
<button onclick="mint()">➕ Mint</button>
<button onclick="lp()">🏦 LP boost</button>
<button onclick="event()">⚡ Event</button>
</div>

</div>

</div>

<div id="log"></div>

<script>

let state = {
name:"",
chain:"",
cash:0,
users:1,
price:0.01,
lp:1000,

supply:1000000,
burned:0,

trust:50,
risk:10,
kyc:40,

roadmap:1
};

function log(t){
let d=document.createElement("div");
d.innerText=t;
document.getElementById("log").prepend(d);
}

function ui(){
document.getElementById("cash").innerText = state.cash.toFixed(0);
document.getElementById("users").innerText = state.users.toFixed(1);
document.getElementById("price").innerText = state.price.toFixed(6);
document.getElementById("mc").innerText = (state.price*state.users).toFixed(0);
document.getElementById("lp").innerText = state.lp.toFixed(0);

document.getElementById("supply").innerText = state.supply;
document.getElementById("burned").innerText = state.burned;

document.getElementById("trust").innerText = state.trust.toFixed(0);
document.getElementById("risk").innerText = state.risk.toFixed(0);
document.getElementById("kyc").innerText = state.kyc.toFixed(0);
document.getElementById("roadmap").innerText = "Phase " + state.roadmap;
}

// ================= START =================
function start(){

state.name = document.getElementById("name").value;
state.chain = document.getElementById("chain").value;
state.cash = parseFloat(document.getElementById("budget").value);

if(!state.name || !state.cash){
alert("Fill inputs");
return;
}

document.getElementById("start").style.display="none";
document.getElementById("game").style.display="block";

log("🚀 Launch: " + state.name + " on " + state.chain);

setInterval(tick,1000);
ui();
}

// ================= ECONOMY =================
function tick(){

// PRICE = LP / SUPPLY
state.price = state.lp / state.supply;
if(state.price < 0.000001) state.price = 0.000001;

// users growth
state.users += state.trust * 0.01;

// cashflow
state.cash += state.users * 0.1;

// LP drift
state.lp += (Math.random()-0.5)*10;

// trust decay by risk
state.trust -= state.risk * 0.01;
if(state.trust < 0) state.trust = 0;

// roadmap
if(state.cash > 500 && state.roadmap === 1){
state.roadmap = 2;
state.trust += 10;
log("📍 Roadmap 2 unlocked");
}

if(state.cash > 1500 && state.roadmap === 2){
state.roadmap = 3;
state.kyc += 20;
log("📍 Roadmap 3 unlocked");
}

ui();
}

// ================= ACTIONS =================

function marketing(){
if(state.cash < 120) return log("❌ No cash");
state.cash -= 120;

state.users += Math.random()*6;
state.trust += 2;

log("📢 Marketing boost");
}

function dev(){
if(state.cash < 150) return log("❌ No cash");
state.cash -= 150;

state.trust += 5;
state.price += 0.002;

log("👨‍💻 Dev improved system");
}

function influencer(){
if(state.cash < 300) return log("❌ No cash");
state.cash -= 300;

state.users += Math.random()*10;
state.price *= 1.1;

log("🚀 Influencer pump");
}

function burn(){
let amount = Math.floor(state.supply * 0.02);
state.supply -= amount;
state.burned += amount;

log("🔥 Burned " + amount);
}

function mint(){
let amount = Math.floor(state.supply * 0.03);
state.supply += amount;

state.trust -= 5;

log("➕ Minted " + amount);
}

function lp(){
state.lp += 200;
state.trust += 2;

log("🏦 Liquidity added");
}

function event(){

let r = Math.random();

if(r < 0.4){
state.price *= 0.7;
state.trust -= 10;
log("💀 Crash event");
}
else if(r < 0.7){
state.price *= 1.2;
state.trust += 5;
log("📈 Pump event");
}
else{
state.lp += 100;
log("🛡 Neutral event");
}

ui();
}

</script>

</body>
</html>
