<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Civilization FIXED</title>

<style>
body{
margin:0;
overflow:hidden;
background:#050b18;
font-family:Arial;
color:white;
}

#topbar{
position:fixed;
top:0;
left:0;
width:100%;
height:50px;
background:#0f172a;
display:flex;
align-items:center;
gap:15px;
padding:5px 10px;
font-size:13px;
border-bottom:2px solid #00d4ff;
}

.resource{
color:#00d4ff;
font-weight:bold;
}

#panel{
position:fixed;
left:10px;
top:70px;
width:220px;
background:#0f172a;
padding:10px;
border-radius:10px;
}

button{
width:100%;
padding:8px;
margin-top:5px;
background:#00d4ff;
border:none;
font-weight:bold;
cursor:pointer;
}

canvas{
position:absolute;
top:0;
left:0;
}
</style>
</head>

<body>

<div id="topbar">
<div class="resource">💎 Treasury: <span id="treasury">0</span></div>
<div class="resource">👥 Holders: <span id="holders">0</span></div>
<div class="resource">📈 Price: <span id="price">0</span></div>
</div>

<div id="panel">
<h3>Builder</h3>
<button onclick="build('community')">Community</button>
<button onclick="build('marketing')">Marketing</button>
<button onclick="build('burn')">Burn</button>
</div>

<canvas id="c"></canvas>

<script>

/* ================= CANVAS FIX ================= */
const c = document.getElementById("c");
const ctx = c.getContext("2d");

function resize(){
c.width = window.innerWidth;
c.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

/* ================= GAME STATE ================= */
let gameStarted = true;

let game = {
treasury:500,
holders:1,
price:0.001,
supply:1000000,
mc:0
};

let buildings = [
{x:5,y:5,type:"community"}
];

/* ================= BUILD ================= */
function build(type){
if(game.treasury < 100) return;

game.treasury -= 100;

buildings.push({
x: Math.floor(Math.random()*20),
y: Math.floor(Math.random()*15),
type
});
}

/* ================= UI ================= */
function ui(){
document.getElementById("treasury").innerText = Math.floor(game.treasury);
document.getElementById("holders").innerText = Math.floor(game.holders);
document.getElementById("price").innerText = game.price.toFixed(6);
}

/* ================= ECONOMY ================= */
setInterval(()=>{

let marketing = buildings.filter(b=>b.type==="marketing").length;
let community = buildings.filter(b=>b.type==="community").length;
let burn = buildings.filter(b=>b.type==="burn").length;

game.holders += community * 0.1;

let demand = marketing * game.holders * 0.001;
let burnEffect = burn * 0.002;

game.price += (demand - burnEffect) * 0.01;

if(game.price < 0.0001) game.price = 0.0001;

game.mc = game.price * game.supply;

game.treasury += marketing * 5;

ui();

},1000);

/* ================= RENDER (IMPORTANT FIX) ================= */
function render(){

ctx.fillStyle="#050b18";
ctx.fillRect(0,0,c.width,c.height);

/* GRID */
ctx.strokeStyle="#111";
for(let x=0;x<c.width;x+=40){
ctx.beginPath();
ctx.moveTo(x,0);
ctx.lineTo(x,c.height);
ctx.stroke();
}

for(let y=0;y<c.height;y+=40){
ctx.beginPath();
ctx.moveTo(0,y);
ctx.lineTo(c.width,y);
ctx.stroke();
}

/* BUILDINGS */
for(let b of buildings){

let x = b.x*40;
let y = b.y*40;

ctx.fillStyle =
b.type==="community"?"#22c55e":
b.type==="marketing"?"#3b82f6":
"#ef4444";

ctx.fillRect(x,y,30,30);

ctx.fillStyle="#fff";
ctx.font="10px Arial";
ctx.fillText(b.type[0], x+10, y+20);
}

requestAnimationFrame(render);
}

render();
ui();

</script>

</body>
</html>
