<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MGOT RTS Rework</title>

<style>
body{
margin:0;
overflow:hidden;
background:#06101f;
font-family:Arial;
color:white;
}

#topbar{
position:fixed;
top:0;
left:0;
width:100%;
height:50px;
background:#0f172a;
display:flex;
align-items:center;
gap:20px;
padding:0 10px;
border-bottom:2px solid #00d4ff;
font-size:13px;
}

.resource{color:#00d4ff;font-weight:bold}

#panel{
position:fixed;
left:10px;
top:70px;
width:200px;
background:#0f172a;
padding:10px;
border-radius:10px;
}

button{
width:100%;
margin-top:5px;
padding:8px;
background:#00d4ff;
border:none;
font-weight:bold;
cursor:pointer;
}

canvas{
position:absolute;
top:0;
left:0;
}
</style>
</head>

<body>

<div id="topbar">
<div class="resource">💎 Treasury: <span id="treasury">0</span></div>
<div class="resource">👥 Population: <span id="pop">0</span></div>
<div class="resource">📈 Price: <span id="price">0</span></div>
<div class="resource">💰 MC: <span id="mc">0</span></div>
</div>

<div id="panel">
<h3>MGOT RTS</h3>

<button onclick="select('farm')">Farm</button>
<button onclick="select('treasury')">Treasury</button>
<button onclick="select('market')">Marketing</button>
<button onclick="select('defense')">Defense</button>
<button onclick="upgrade()">Upgrade selected</button>
</div>

<canvas id="c"></canvas>

<script>

const c=document.getElementById("c");
const ctx=c.getContext("2d");

function resize(){
c.width=innerWidth;
c.height=innerHeight;
}
window.addEventListener("resize",resize);
resize();

/* ================= GAME ================= */
let game={
treasury:500,
pop:1,
price:0.001,
mc:0
};

let gridSize=10;
let cell=60;

let selectedType="farm";

let buildings=[];

/* ================= BUILD ================= */
function select(t){
selectedType=t;
}

/* click to place */
c.addEventListener("click",(e)=>{

let x=Math.floor(e.clientX/cell);
let y=Math.floor(e.clientY/cell);

let existing=buildings.find(b=>b.x==x && b.y==y);

if(existing){
selected=existing;
return;
}

if(game.treasury<100) return;

game.treasury-=100;

buildings.push({
x,y,
type:selectedType,
level:1
});

});

/* ================= UPGRADE ================= */
let selected=null;

function upgrade(){
if(!selected) return;
if(game.treasury<selected.level*80) return;

game.treasury-=selected.level*80;
selected.level++;
}

/* ================= ECONOMY ================= */
setInterval(()=>{

let farms=buildings.filter(b=>b.type==="farm");
let treasury=buildings.filter(b=>b.type==="treasury");
let market=buildings.filter(b=>b.type==="market");
let defense=buildings.filter(b=>b.type==="defense");

/* FOOD / POP */
game.pop += farms.length * 0.05;

/* TREASURY INCOME */
game.treasury += treasury.length * 5;

/* MARKET EFFECT (PRICE UP) */
let demand = market.length * game.pop * 0.001;

/* DEFENSE STABILIZES */
let stability = defense.length * 0.002;

game.price += (demand - stability) * 0.01;

if(game.price<0.0001) game.price=0.0001;

/* MC */
game.mc = game.price * 1000000;

/* POP GROWTH */
game.pop += 0.01;

ui();

},1000);

/* ================= UI ================= */
function ui(){
document.getElementById("treasury").innerText=Math.floor(game.treasury);
document.getElementById("pop").innerText=Math.floor(game.pop);
document.getElementById("price").innerText=game.price.toFixed(6);
document.getElementById("mc").innerText=Math.floor(game.mc);
}

/* ================= RENDER ================= */
function render(){

ctx.fillStyle="#06101f";
ctx.fillRect(0,0,c.width,c.height);

/* grid */
for(let x=0;x<gridSize;x++){
for(let y=0;y<gridSize;y++){
ctx.strokeStyle="#0f172a";
ctx.strokeRect(x*cell,y*cell,cell,cell);
}
}

/* buildings */
for(let b of buildings){

let x=b.x*cell;
let y=b.y*cell;

ctx.fillStyle =
b.type==="farm"?"#22c55e":
b.type==="treasury"?"#fbbf24":
b.type==="market"?"#3b82f6":
"#ef4444";

ctx.fillRect(x+10,y+10,40,40);

ctx.fillStyle="white";
ctx.font="12px Arial";
ctx.fillText(b.type[0].toUpperCase(),x+25,y+35);

/* level */
ctx.fillText(b.level,x+10,y+15);
}

requestAnimationFrame(render);
}

render();
ui();

</script>

</body>
</html>
