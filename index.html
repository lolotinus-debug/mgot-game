<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MGOT MMO Economy RTS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
margin:0;
background:#050b18;
color:white;
font-family:Arial;
overflow:hidden;
}

/* TOPBAR */
#topbar{
position:fixed;
top:0;
left:0;
width:100%;
height:60px;
background:#0f172a;
display:flex;
align-items:center;
gap:12px;
padding:0 10px;
border-bottom:2px solid #00d4ff;
font-size:12px;
z-index:10;
}

.resource{color:#00d4ff;font-weight:bold;}

/* PANEL */
#panel{
position:fixed;
left:10px;
top:80px;
width:240px;
background:#0f172a;
padding:10px;
border-radius:10px;
z-index:10;
}

button{
width:100%;
margin:5px 0;
padding:10px;
border:none;
cursor:pointer;
background:#00d4ff;
font-weight:bold;
}

canvas{
position:absolute;
top:0;
left:0;
}
</style>
</head>

<body>

<div id="topbar">
<div class="resource">💎 Treasury: <span id="t">0</span></div>
<div class="resource">👥 Players: <span id="p">1</span></div>
<div class="resource">📈 Price: <span id="pr">0</span></div>
<div class="resource">🪙 Supply: <span id="s">0</span></div>
<div class="resource">💰 MC: <span id="m">0</span></div>
</div>

<div id="panel">
<h3>MGOT MMO</h3>

<button onclick="build('hub')">🏘 Hub</button>
<button onclick="build('farm')">⚙ Economy Farm</button>
<button onclick="build('market')">📈 Market Node</button>
<button onclick="build('raid')">⚔ Defense Tower</button>

<button onclick="raid()">🔥 RAID PLAYER</button>
</div>

<canvas id="c"></canvas>

<script>

const c=document.getElementById("c");
const ctx=c.getContext("2d");

function resize(){
c.width=innerWidth;
c.height=innerHeight;
}
resize();
window.addEventListener("resize",resize);

/* ================= WORLD STATE ================= */

let state = {
treasury:500,
players:1,
price:0.001,
supply:1000000,
mc:1000,
lp:100,
raidPower:0
};

let buildings = [];

/* fake MMO players */
let worldPlayers = [
{ id:"AI1", power:10, treasury:200 },
{ id:"AI2", power:15, treasury:300 },
{ id:"AI3", power:20, treasury:500 }
];

/* ================= BUILD ================= */
function build(type){

if(state.treasury < 100) return;

state.treasury -= 100;

buildings.push({
x:Math.random()*20|0,
y:Math.random()*15|0,
type:type,
level:1
});
}

/* ================= RAID SYSTEM ================= */
function raid(){

let target = worldPlayers[Math.random()*worldPlayers.length|0];

let myPower =
buildings.filter(b=>b.type==="raid").length * 10 +
buildings.filter(b=>b.type==="hub").length * 5;

if(myPower > target.power){

state.treasury += target.treasury * 0.2;
state.players++;

log("🔥 RAID WIN vs " + target.id);
}
else{
state.treasury *= 0.9;
log("💀 RAID LOST vs " + target.id);
}
}

/* ================= ECONOMY ENGINE ================= */
setInterval(()=>{

let hub = buildings.filter(b=>b.type==="hub").length;
let farm = buildings.filter(b=>b.type==="farm").length;
let market = buildings.filter(b=>b.type==="market").length;

/* HOLDERS = players growth */
state.players += hub * 0.05;

/* TREASURY */
state.treasury += farm * 10;

/* PRICE SIM */
let demand = (market * state.players * 0.001);
let sellPressure = Math.random()*0.5;

state.price += (demand - sellPressure) * 0.01;

if(state.price < 0.0001) state.price = 0.0001;

/* SUPPLY BURN */
state.supply -= hub * 2;
if(state.supply < 10000) state.supply = 10000;

/* MC */
state.mc = state.price * state.supply;

/* LP */
state.lp += demand * 0.5;
state.lp -= sellPressure * 0.3;
if(state.lp < 10) state.lp = 10;

ui();

},1000);

/* ================= UI ================= */
function ui(){
document.getElementById("t").innerText=Math.floor(state.treasury);
document.getElementById("p").innerText=Math.floor(state.players);
document.getElementById("pr").innerText=state.price.toFixed(6);
document.getElementById("s").innerText=state.supply;
document.getElementById("m").innerText=Math.floor(state.mc);
}

/* ================= RENDER ================= */
function render(){

ctx.fillStyle="#050b18";
ctx.fillRect(0,0,c.width,c.height);

for(let b of buildings){

let x=b.x*40;
let y=b.y*40;

ctx.fillStyle =
b.type==="hub"?"#22c55e":
b.type==="farm"?"#3b82f6":
b.type==="market"?"#f59e0b":
"#ef4444";

ctx.fillRect(x,y,30,30);

ctx.fillStyle="#fff";
ctx.font="10px Arial";
ctx.fillText(b.type[0],x+10,y+20);
}

requestAnimationFrame(render);
}

/* ================= LOG ================= */
function log(t){
console.log(t);
}

render();
ui();

</script>

</body>
</html>
