<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tokenomics Simulator</title>

<style>
body{
margin:0;
font-family:Arial;
background:#020617;
color:white;
overflow:hidden;
}

#top{
position:fixed;
top:0;
left:0;
width:100%;
height:60px;
background:#0f172a;
display:flex;
align-items:center;
gap:15px;
padding:0 10px;
border-bottom:2px solid #00d4ff;
}

.stat{
color:#00d4ff;
font-weight:bold;
font-size:13px;
}

#panel{
position:fixed;
left:10px;
top:80px;
width:280px;
background:#0f172a;
padding:12px;
border-radius:10px;
}

button{
width:100%;
margin-top:8px;
padding:10px;
border:none;
border-radius:6px;
background:#00d4ff;
font-weight:bold;
cursor:pointer;
}

button:hover{
transform:scale(1.03);
}

#log{
position:fixed;
right:10px;
top:80px;
width:320px;
height:85%;
background:#000;
padding:10px;
overflow:auto;
font-size:12px;
}
</style>
</head>

<body>

<div id="top">
  <div class="stat">🪙 Price: <span id="price">0</span></div>
  <div class="stat">💎 MC: <span id="mc">0</span></div>
  <div class="stat">🏦 LP: <span id="lp">0</span></div>
  <div class="stat">📦 Supply: <span id="supply">0</span></div>
  <div class="stat">🔥 Burned: <span id="burned">0</span></div>
</div>

<div id="panel">
<h3>Token Controls</h3>

<button onclick="buy()">🟢 Buy pressure</button>
<button onclick="sell()">🔴 Sell pressure</button>
<button onclick="burn()">🔥 Burn supply</button>
<button onclick="mint()">➕ Mint supply</button>
<button onclick="addLP()">🏦 Add liquidity</button>
<button onclick="removeLP()">💧 Remove liquidity</button>
</div>

<div id="log"></div>

<script>

let state = {
lp: 10000,
totalSupply: 1000000,
circulating: 800000,
burned: 0,
price: 0.01,
buys: 0,
sells: 0
};

function log(t){
let d=document.createElement("div");
d.innerText=t;
document.getElementById("log").prepend(d);
}

// ================= PRICE ENGINE =================
function updatePrice(){

// AMM-style simplified formula
state.price = state.lp / state.circulating;

if(state.price < 0.000001) state.price = 0.000001;

let mc = state.price * state.circulating;

// UI
document.getElementById("price").innerText = state.price.toFixed(6);
document.getElementById("mc").innerText = mc.toFixed(0);
document.getElementById("lp").innerText = state.lp.toFixed(0);
document.getElementById("supply").innerText = state.circulating;
document.getElementById("burned").innerText = state.burned;
}

// ================= ACTIONS =================

function buy(){
state.lp += 50;
state.buys++;

log("🟢 Buy pressure added");
updatePrice();
}

function sell(){
state.lp -= 40;
state.sells++;

if(state.lp < 1000) state.lp = 1000;

log("🔴 Sell pressure added");
updatePrice();
}

function burn(){
let amount = Math.floor(state.circulating * 0.01);

state.circulating -= amount;
state.burned += amount;

log("🔥 Burned " + amount + " tokens");
updatePrice();
}

function mint(){
let amount = Math.floor(state.circulating * 0.02);

state.circulating += amount;

log("➕ Minted " + amount + " tokens");
updatePrice();
}

function addLP(){
state.lp += 500;
log("🏦 Liquidity added");
updatePrice();
}

function removeLP(){
state.lp -= 500;
if(state.lp < 1000) state.lp = 1000;

log("💧 Liquidity removed");
updatePrice();
}

// ================= AUTO MARKET =================
setInterval(()=>{

// natural drift
state.lp += (Math.random()-0.5)*20;

// pressure effect
state.lp += state.buys*2;
state.lp -= state.sells*2;

// reset flow
state.buys *= 0.95;
state.sells *= 0.95;

updatePrice();

},1000);

updatePrice();

</script>

</body>
</html>
