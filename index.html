<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Creator Simulator</title>

<style>
body{
margin:0;
font-family:Arial;
background:#020617;
color:white;
overflow:hidden;
}

#top{
position:fixed;
top:0;left:0;
width:100%;
height:60px;
background:#0f172a;
display:flex;
align-items:center;
gap:20px;
padding:0 15px;
border-bottom:2px solid #00d4ff;
}

.stat{
color:#00d4ff;
font-weight:bold;
}

#panel{
position:fixed;
left:10px;
top:80px;
width:260px;
background:#0f172a;
padding:12px;
border-radius:10px;
}

button{
width:100%;
margin-top:8px;
padding:10px;
background:#00d4ff;
border:none;
font-weight:bold;
cursor:pointer;
border-radius:6px;
}

button:hover{
transform:scale(1.03);
}

#log{
position:fixed;
right:10px;
top:80px;
width:300px;
height:400px;
background:#000;
padding:10px;
overflow:auto;
font-size:12px;
}
</style>
</head>

<body>

<div id="top">
  <div class="stat">💰 Cash: <span id="cash">1000</span></div>
  <div class="stat">👥 Users: <span id="users">1</span></div>
  <div class="stat">📈 Price: <span id="price">0.01</span></div>
  <div class="stat">💎 MarketCap: <span id="mc">10</span></div>
</div>

<div id="panel">
<h3>Actions</h3>

<button onclick="dev()">👨‍💻 Develop Token (-200)</button>
<button onclick="marketing()">📢 Marketing (-150)</button>
<button onclick="buyInfluencer()">🚀 Influencer (-300)</button>
<button onclick="rugCheck()">⚠ Risk Event</button>
</div>

<div id="log"></div>

<script>

let state = {
cash:1000,
users:1,
price:0.01,
risk:0
};

function log(t){
let d=document.createElement("div");
d.innerText=t;
document.getElementById("log").prepend(d);
}

function ui(){
document.getElementById("cash").innerText = Math.floor(state.cash);
document.getElementById("users").innerText = Math.floor(state.users);
document.getElementById("price").innerText = state.price.toFixed(4);
document.getElementById("mc").innerText = Math.floor(state.price * state.users);
}

// ===== ACTIONS =====

function dev(){
if(state.cash < 200) return log("❌ Not enough cash");
state.cash -= 200;
state.price += 0.005;
log("🧠 Token improved");
ui();
}

function marketing(){
if(state.cash < 150) return log("❌ Not enough cash");
state.cash -= 150;

let gain = Math.random()*3 + 1;
state.users += gain;

log("📢 Marketing boosted users +" + gain.toFixed(1));
ui();
}

function buyInfluencer(){
if(state.cash < 300) return log("❌ Not enough cash");
state.cash -= 300;

let pump = Math.random()*0.05;
state.price += pump;

state.users += Math.random()*5;

log("🚀 Influencer pumped token");
ui();
}

function rugCheck(){
let crash = Math.random();

if(crash < 0.4){
state.price *= 0.5;
state.users *= 0.7;
log("💀 RUG EVENT! Market crashed");
} else {
state.price *= 1.2;
log("🛡 Safe event, trust increased");
}

ui();
}

// ===== PASSIVE ECONOMY =====

setInterval(()=>{

let growth = state.users * 0.001;
state.price += growth;

state.cash += state.users * 0.2;

if(state.price < 0.001) state.price = 0.001;

ui();

},1000);

ui();

</script>

</body>
</html>
